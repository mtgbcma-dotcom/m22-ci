name: CI - Django e PostgreSQL

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Testes no Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: m22-ci-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_DB: bookstore
      POSTGRES_USER: bookstore
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,[::1]
      APP_PORT: "8003"

    steps:
      - name: Obter o codigo
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Gerar configuracao temporaria de CI
        shell: bash
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "DJANGO_SECRET_KEY=$(openssl rand -hex 48)"
          } >> "$GITHUB_ENV"

      - name: Validar o Docker Compose
        run: docker compose config --quiet

      - name: Construir e iniciar a API e o PostgreSQL
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Conferir os servicos
        run: docker compose ps

      - name: Verificar a configuracao do Django
        run: docker compose exec -T web python manage.py check

      - name: Verificar as migracoes
        run: docker compose exec -T web python manage.py makemigrations --check --dry-run

      - name: Executar os testes no PostgreSQL
        run: docker compose exec -T web python manage.py test --verbosity 2

      - name: Exibir logs em caso de falha
        if: ${{ failure() && steps.checkout.outcome == 'success' }}
        run: docker compose logs --no-color --tail 100 web db

      - name: Remover os recursos temporarios de CI
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: docker compose down --volumes --remove-orphans
